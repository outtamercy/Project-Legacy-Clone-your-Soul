nexusDescription="[i][b]The mod itself is not heavy at all[/b][/i] [b][color=#00ffff]and[/color] [color=#00ffff]has two basic functions.[/color][/b]\n<br />\n<br />[color=#00ffff]First, to give the Night King power to raise an army of the dead.[/color]\n<br />[color=#00ff00]And second is to provide the means to quickly create a lookalike face of The Night King and to give tips on cosmetics.\n<br />[/color]\n<br />[b]The first part is simple.[/b]\n<br />[color=#00ffff]You have to find and [b]activate the Ritual Stone[/b], which normally gives you the power of raising once a day nearby dead. \n<br />Now, when you activate it, [b]you will be granted a power called \"Raise Wights\"[/b], [b]which will allow you to raise dead on large area and as many times as you want.[/b] You are free to spam the button. I have also added a spell that will aid you in making corpses for wight-making. It is located near the Ritual Stone, behind a tree.[/color]\n<br />\n<br />\n<br />[b]The second part is slightly longer, but rewarding, nevertheless.[/b]\n<br />\n<br />[color=#00ff00]I will help you get the looks of the Night King and cool looking zombies.[/color]\n<br />\n<br />So, the looks:\n<br />[b]Make sure you have installed[/b] [url=https://skse.silverlock.org/]SKSE[/url], [url=https://www.nexusmods.com/skyrimspecialedition/mods/19080]Racemenu mod, [/url] and [url=https://www.nexusmods.com/skyrimspecialedition/mods/21347]Runic Eyes by MARI SE\n<br />[/url]\n<br />[color=#00ff00]The rotting zombies effect is a masterpiece by[/color] [url=https://www.nexusmods.com/skyrimspecialedition/users/4640202]WDog367[/url], his mod is [url=https://www.nexusmods.com/skyrimspecialedition/mods/5197]Undead FX[/url], [color=#00ff00]it adds cool effects to raised dead, making them rott and look realistic.[/color]\n<br />\n<br />[b]The installation of those is incredibly simple, there are guides on their main pages.[/b] [b][color=#ffff00]YOU NEED ALL 4 INSTALLED TO HAVE THE 2 PART OF MY MOD WORKING![/color][/b]\n<br />\n<br />Below is a video about the mod.[b][color=#ffff00] !!!TURN ON THE CAPTIONS!!! In the video you will see how to get the face, the body, the eyes of the Night King, as well as short power and sound effects demonstrations.[/color][/b]\n<br />\n<br />[youtube]DhA6iWH1KvI[/youtube]\n<br />\n<br />\n<br />[color=#00ff00]The installation and unistallation is really simple.\n<br />Use Vortex or any other Mod managing program to do both.\n<br />\n<br />In case I release an update, you will need just to install the new files over the existing, nothing more.\n<br />[/color]\n<br />[size=4]Many thanks to [url=https://next.nexusmods.com/profile/ADHDCubitumEamus]Chris Avsh.[/url] for testing the mod.[/size]\n<br />\n<br />[size=5][b]My other projects:\n<br />For Skyrim SE\n<br />[url=https://www.nexusmods.com/skyrimspecialedition/mods/161270?tab=description]Devour Mortal Soul Shout[/url]\n<br />[url=https://www.nexusmods.com/skyrimspecialedition/mods/56307]Bat jump form for human form[/url]\n<br />[url=https://www.nexusmods.com/skyrimspecialedition/mods/15779]Mist Flight[/url]\n<br />[size=5][b][url=https://www.nexusmods.com/skyrimspecialedition/mods/5155]Concentrative Fire and Frost Breath[/url][/b][/size]\n<br />[size=5][b][url=https://www.nexusmods.com/skyrimspecialedition/mods/13905]Flying mod by porroone[/url][/b][/size]\n<br />[url=https://www.nexusmods.com/skyrimspecialedition/mods/5082]Avada Kedavra spell[/url]\n<br />\n<br />For Skyrim\n<br />[url=https://www.nexusmods.com/skyrim/mods/95258]Mist Flight Revised[/url][/b][/size]"
